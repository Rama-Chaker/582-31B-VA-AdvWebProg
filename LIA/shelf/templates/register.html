{% extends "base.html" %} {% block content %}
<div class="form-container">
    <h2>Register</h2>
    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                value="{{ username or '' }}"
                required
                maxlength="100"
            />
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ email or '' }}"
                required
                maxlength="100"
            />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                minlength="8"
                maxlength="20"
            />
            <span
                >Must be 8-20 characters, include an uppercase letter and a
                number.</span
            >
        </div>

        <button type="submit" class="button">Register</button>
    </form>
</div>
{% endblock %}
