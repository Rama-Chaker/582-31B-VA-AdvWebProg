{% extends "base.html" %}

{% block content %}
<div class="hero">
    <h1>Welcome to Shelf</h1>
    <p>Keep track of the books you want to read, are currently reading, and have finished.</p>
    {% if not current_user.is_authenticated %}
        <div class="buttons">
            <a href="{{ url_for('register') }}" class="button">Register</a>
            <a href="{{ url_for('login') }}" class="button">Log In</a>
        </div>
    {% else %}
        <div class="buttons">
            <a href="{{ url_for('books') }}" class="button">Go to My Reading List</a>
        </div>
    {% endif %}
</div>
{% endblock %}
