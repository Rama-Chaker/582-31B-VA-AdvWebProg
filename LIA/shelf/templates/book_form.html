{% extends "base.html" %} 
{% block content %}
<h2>Add a New Book</h2>

<form method="POST">
    <div>
        <label for="title">Title:</label><br />
        <input
            type="text"
            id="title"
            name="title"
            value="{{ title or '' }}"
            required
            maxlength="100"
        />
    </div>

    <div>
        <label for="author">Author:</label><br />
        <input
            type="text"
            id="author"
            name="author"
            value="{{ author or '' }}"
            required
            maxlength="100"
        />
    </div>

    <div>
        <label for="status">Status:</label><br />
        <select id="status" name="status">
            <option value="Want to read" {% if status == "Want to read" %}selected{% endif %}>
                Want to read
            </option>
            <option value="Reading" {% if status == "Reading" %}selected{% endif %}>
                Reading
            </option>
            <option value="Finished" {% if status == "Finished" %}selected{% endif %}>
                Finished
            </option>
        </select>
    </div>

    <div>
        <label for="note">Note (Optional):</label><br />
        <textarea id="note" name="note" maxlength="1000">{{ note or '' }}</textarea>
    </div>

    <br />
    <button type="submit">Add Book</button>
    <a href="{{ url_for('books') }}">Cancel</a>
</form>
{% endblock %}
